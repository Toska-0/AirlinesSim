name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.res"
      - "**/*.json"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK (ARM64)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot project
        run: |
          godot --version
          godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AirlinesSim-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirlinesSim-Android-APK
          path: build/AirlinesSim-debug.apk
          if-no-files-found: error
          retention-days: 14
