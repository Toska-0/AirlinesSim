name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "**/*.gd"
      - "**/*.tscn"
      - "**/*.tres"
      - "**/*.res"
      - "**/*.json"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Verify Godot project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AirlinesSim-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirlinesSim-Android-APK
          path: build/AirlinesSim-debug.apk
          if-no-files-found: error
          retention-days: 14
